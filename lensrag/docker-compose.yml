services:
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    ports: ["8000:8000"]          # 0.0.0.0으로 열려서 같은 Wi-Fi의 폰이 접속 가능
    env_file: .env
    environment:
      - RAG_URL=http://rag:8001
    restart: unless-stopped

  # 폰 카메라(getUserMedia)는 HTTPS에서만 동작해서, 같은 api를 8443에서 HTTPS로 한 번 더 띄움
  # 인증서 만들기: bash scripts/make-cert.sh {PC Wi-Fi IP}, .env의 PUBLIC_BASE_URL은 https://{IP}:8443
  api-https:
    build: { context: ., dockerfile: api/Dockerfile }
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8443",
              "--ssl-keyfile", "/certs/key.pem", "--ssl-certfile", "/certs/cert.pem"]
    ports: ["8443:8443"]
    env_file: .env
    environment:
      - RAG_URL=http://rag:8001
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    env_file: .env
    volumes:
      - ./models/hf:/root/.cache
      - ./models/paddleocr:/root/.paddleocr
      - ./models/paddlex:/root/.paddlex
    restart: unless-stopped

  rag:
    build: { context: ., dockerfile: rag/Dockerfile }
    env_file: .env
    volumes:
      - ./models/hf:/root/.cache
    restart: unless-stopped
    # 포트는 외부에 열지 않음 (api만 내부 주소 http://rag:8001 로 호출)
