# server 컨테이너 1개: FastAPI + SQLite + 대시보드 정적 파일. 로컬과 EC2에서 동일하게 사용합니다.
#   cp .env.example .env  →  docker compose up -d --build  →  http://localhost
# dashboard/ 폴더를 그대로 연결하므로, 대시보드를 수정하면 다시 빌드할 필요 없이 새로고침만 하면 됩니다.

services:
  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:8000"
    volumes:
      - ./dashboard:/app/static:ro
      - server-data:/data          # ppe.db, media/ (위반 사진)

volumes:
  server-data:
