events {}

http {
    upstream c3 {
        least_conn;
        # 시작 시 레플리카 IP 전부로 해석됨. 레플리카 변경 후 재시작 필요
        # max_fails=0: 느려서 타임아웃 난 레플리카를 빼지 않음 (기본값은 1번 실패에 10초 제외 → 전부 빠지면 모든 요청 502)
        server c3-sam2:8000 max_fails=0;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://c3;
            proxy_next_upstream error;    # 연결 실패 때만 다른 레플리카로 재시도
            proxy_read_timeout 12s;       # C1의 TIMEOUT_C3(10초)보다 약간 길게
        }
    }
}
