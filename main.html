<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LensRAG</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>html,body{margin:0;padding:0;}body{overscroll-behavior:none;}::-webkit-scrollbar{display:none;}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface": "#0b1326",
        "surface-container-lowest": "#060e20",
        "surface-container-low": "#131b2e",
        "surface-container": "#171f33",
        "surface-container-high": "#222a3d",
        "surface-variant": "#2d3449",
        "surface-bright": "#31394d",
        "on-surface": "#dae2fd",
        "on-surface-variant": "#c3c6d7",
        "outline": "#8d90a0",
        "primary": "#b4c5ff",
        "primary-container": "#2563eb",
        "on-primary": "#002a78",
        "on-primary-container": "#eeefff",
        "inverse-primary": "#0053db",
        "secondary": "#7bd0ff"
      },
      borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
      spacing: {
        "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "0.75rem",
        "space-lg": "1.25rem", "space-xl": "2rem", "margin": "1.5rem"
      },
      fontFamily: { sans: ["Inter", "sans-serif"] },
      fontSize: {
        "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "500" }],
        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }],
        "body-sm": ["12px", { lineHeight: "16px" }],
        "body-md": ["14px", { lineHeight: "20px" }],
        "code-sm": ["12px", { lineHeight: "16px", letterSpacing: "-0.01em" }],
        "headline-sm": ["16px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "600" }],
        "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "600" }]
      }
    }
  }
};
</script>
</head>
<body class="bg-surface font-sans text-body-md text-on-surface antialiased">

<header class="fixed top-0 left-0 right-0 w-full z-50 bg-surface-container-lowest/80 backdrop-blur-xl">
  <div class="h-14 w-full px-margin flex items-center gap-space-md">
    <div class="w-7 h-7 rounded-lg bg-primary-container flex items-center justify-center">
      <span class="material-symbols-outlined text-on-primary-container text-[18px]">filter_center_focus</span>
    </div>
    <span class="text-headline-sm text-on-surface tracking-tight">LensRAG</span>
  </div>
</header>

<main class="w-full pt-14 min-h-screen bg-surface">
  <div class="max-w-6xl mx-auto w-full px-margin py-space-xl flex flex-col gap-space-xl">

    <div class="flex flex-col gap-space-xs">
      <h1 class="text-headline-lg text-on-surface tracking-tight">Vision RAG Pipeline</h1>
      <p class="text-body-md text-on-surface-variant max-w-xl">
        모바일 카메라로 촬영한 내용을 바탕으로 지식 검색을 수행합니다.
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-space-xl items-stretch">

      <!-- 1. 모바일 카메라 연결 -->
      <section class="flex flex-col bg-surface-container-low rounded-xl p-space-xl gap-space-lg border border-surface-variant/30">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-space-sm">
            <div class="w-7 h-7 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center text-label-md font-semibold">1</div>
            <div class="flex flex-col">
              <span class="text-headline-sm text-on-surface">모바일 카메라 연결</span>
              <span class="text-body-sm text-outline">Mobile Camera</span>
            </div>
          </div>
          <span class="text-label-sm px-space-sm py-1 rounded-full bg-surface-container-high text-outline flex items-center gap-1.5" id="cameraStatus">
            <span class="w-2 h-2 rounded-full bg-outline"></span>서버 연결 중
          </span>
        </div>

        <!-- 휴대폰 연결 전: QR 코드 -->
        <div id="qrView" class="flex flex-1 flex-col items-center justify-center bg-surface-container-lowest p-space-xl rounded-xl border border-surface-variant/20 gap-space-md">
          <div class="p-space-md bg-white rounded-xl">
            <img src="connection_qr.png" alt="연결용 QR 코드" class="w-48 h-48 object-contain" style="image-rendering: pixelated;"/>
          </div>
          <p class="text-body-sm text-on-surface-variant text-center leading-relaxed">
            휴대폰 카메라로 QR 코드를 스캔하여 연결하세요.
          </p>
          <span id="cameraUrl" class="text-body-sm text-outline break-all text-center"></span>
        </div>

        <!-- 휴대폰 연결 후: 실시간 카메라 화면 (가이드 박스 비율은 camera.html과 동일) -->
        <div id="liveView" class="hidden relative w-full rounded-xl overflow-hidden bg-surface-container-lowest border border-surface-variant/20">
          <img id="liveFrame" alt="휴대폰 카메라 화면" class="block w-full h-auto"/>
          <div class="absolute border-2 border-secondary rounded-xl pointer-events-none" style="left:5%;top:30%;width:90%;height:40%;box-shadow:0 0 0 9999px rgba(6,14,32,0.45);"></div>
          <span class="absolute top-2 left-2 text-label-sm px-space-sm py-0.5 rounded-full bg-surface-container-lowest/80 text-secondary flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>LIVE
          </span>
        </div>

        <div class="bg-surface-container-lowest p-space-lg rounded-xl flex flex-col gap-space-sm border border-surface-variant/20 min-h-[96px]">
          <span class="text-label-sm text-secondary font-medium flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[16px]">text_fields</span> 인식된 문장
          </span>
          <div class="text-body-md text-on-surface leading-relaxed whitespace-pre-wrap" id="ocrText"><span class="text-outline">휴대폰에서 문장 인식을 누르면 여기에 표시됩니다.</span></div>
        </div>
      </section>

      <!-- 2. RAG 지식 검색 -->
      <section class="flex flex-col bg-surface-container-low rounded-xl p-space-xl gap-space-lg border border-surface-variant/30">
        <div class="flex items-center gap-space-sm">
          <div class="w-7 h-7 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center text-label-md font-semibold">2</div>
          <div class="flex flex-col">
            <span class="text-headline-sm text-on-surface">RAG 지식 검색</span>
            <span class="text-body-sm text-outline">Semantic Retrieval</span>
          </div>
        </div>
        <div class="flex flex-col gap-space-sm">
          <label class="text-label-sm text-outline" for="ragQueryInput">자연어 질문</label>
          <div class="relative">
            <input class="w-full bg-surface-container-lowest text-on-surface text-body-md rounded-xl pl-space-md pr-14 py-space-md placeholder:text-outline focus:outline-none focus:bg-surface-container border border-surface-variant/30" id="ragQueryInput" placeholder="스캔된 문서나 부품에 대해 질문하세요..." type="text"/>
            <button class="absolute right-2 top-2 bottom-2 px-space-md rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center hover:bg-inverse-primary transition-colors" id="searchBtn" aria-label="검색">
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
          </div>
        </div>
        <div class="bg-surface-container-lowest p-space-lg rounded-xl flex flex-col gap-space-sm border border-surface-variant/20 flex-1 min-h-[160px]">
          <span class="text-label-sm text-secondary font-medium flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[16px]">auto_awesome</span> 답변
          </span>
          <div class="text-body-md text-on-surface leading-relaxed pt-space-xs whitespace-pre-wrap" id="answerContent"><span class="text-outline">질문을 입력하면 답변이 여기에 표시됩니다.</span></div>
        </div>
        <button class="w-full py-space-sm rounded-lg bg-surface-container-high hover:bg-surface-bright text-on-surface text-label-md flex items-center justify-center gap-space-xs transition-colors" id="copyAnswerBtn">
          <span class="material-symbols-outlined text-[16px]">content_copy</span><span>답변 복사</span>
        </button>
      </section>

    </div>
  </div>
</main>

<script>
(function () {
  const searchBtn = document.getElementById('searchBtn');
  const ragQueryInput = document.getElementById('ragQueryInput');
  const answerContent = document.getElementById('answerContent');
  const copyAnswerBtn = document.getElementById('copyAnswerBtn');
  let hasAnswer = false;

  // TODO: 실제 RAG 백엔드 API 호출로 교체
  async function fetchAnswer(query) {
    throw new Error('백엔드가 아직 연결되지 않았습니다.');
  }

  async function runSearch() {
    const query = ragQueryInput.value.trim();
    if (!query) return;
    hasAnswer = false;
    answerContent.innerHTML = '<span class="text-outline">검색 중...</span>';
    try {
      answerContent.textContent = await fetchAnswer(query);
      hasAnswer = true;
    } catch (err) {
      answerContent.innerHTML = '';
      const msg = document.createElement('span');
      msg.className = 'text-outline';
      msg.textContent = err.message;
      answerContent.appendChild(msg);
    }
  }

  searchBtn.addEventListener('click', runSearch);
  ragQueryInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') runSearch();
  });

  copyAnswerBtn.addEventListener('click', () => {
    if (!hasAnswer) return;
    navigator.clipboard?.writeText(answerContent.innerText);
    const original = copyAnswerBtn.innerHTML;
    copyAnswerBtn.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span><span>복사 완료</span>';
    setTimeout(() => { copyAnswerBtn.innerHTML = original; }, 1200);
  });
})();

// ---------- 휴대폰 카메라 연동 (WebSocket) ----------
(function () {
  const cameraStatus = document.getElementById('cameraStatus');
  const qrView = document.getElementById('qrView');
  const liveView = document.getElementById('liveView');
  const liveFrame = document.getElementById('liveFrame');
  const ocrText = document.getElementById('ocrText');
  const cameraUrl = document.getElementById('cameraUrl');
  let frameUrl = null;

  fetch('/info').then((r) => r.json()).then((info) => { cameraUrl.textContent = info.cameraUrl; }).catch(() => {});

  function setStatus(label, active) {
    cameraStatus.className = 'text-label-sm px-space-sm py-1 rounded-full bg-surface-container-high flex items-center gap-1.5 '
      + (active ? 'text-secondary' : 'text-outline');
    cameraStatus.innerHTML = `<span class="w-2 h-2 rounded-full ${active ? 'bg-secondary animate-pulse' : 'bg-outline'}"></span>${label}`;
  }

  function setCameraConnected(connected) {
    qrView.classList.toggle('hidden', connected);
    liveView.classList.toggle('hidden', !connected);
    setStatus(connected ? '휴대폰 연결됨' : '스캔 대기', connected);
  }

  function showOcr(text, muted) {
    ocrText.innerHTML = '';
    const span = document.createElement('span');
    if (muted) span.className = 'text-outline';
    span.textContent = text;
    ocrText.appendChild(span);
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = 'blob';
    ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', role: 'viewer' }));
    ws.onmessage = (e) => {
      if (e.data instanceof Blob) {
        const url = URL.createObjectURL(e.data);
        liveFrame.src = url;
        if (frameUrl) URL.revokeObjectURL(frameUrl);
        frameUrl = url;
        return;
      }
      const msg = JSON.parse(e.data);
      if (msg.type === 'status') {
        setCameraConnected(msg.camera);
      } else if (msg.type === 'ocr') {
        if (msg.status === 'running') showOcr('휴대폰에서 인식 중...', true);
        else if (msg.status === 'done') showOcr(msg.text, false);
        else if (msg.status === 'empty') showOcr('문장을 찾지 못했습니다.', true);
        else if (msg.status === 'error') showOcr('인식 실패: ' + msg.text, true);
      }
    };
    ws.onclose = () => {
      setStatus('서버 연결 끊김', false);
      setTimeout(connect, 1500);
    };
  }

  connect();
})();
</script>
</body>
</html>
