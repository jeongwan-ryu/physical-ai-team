events {}

http {
    upstream c3 {
        least_conn;
        server c3-sam2:8000;          # 시작 시 레플리카 IP 전부로 해석됨. 레플리카 변경 후 재시작 필요
    }

    server {
        listen 80;

        location / {
            proxy_pass http://c3;
            proxy_next_upstream error;    # 연결 실패 때만 다른 레플리카로 재시도
            proxy_read_timeout 12s;       # C1의 TIMEOUT_C3(10초)보다 약간 길게
        }
    }
}
