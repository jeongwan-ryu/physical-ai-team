# edge: ultralytics 공식 이미지를 그대로 쓰고, 코드는 폴더를 연결해서 실행합니다 (Dockerfile 없음).
#   cp .env.example .env  →  docker compose up
# 노트북: EDGE_BASE=ultralytics/ultralytics:8.4.198-cpu / Pi: ultralytics/ultralytics:8.4.198-arm64
# 코드를 고치면 docker compose restart 만 하면 됩니다.

services:
  edge:
    image: ${EDGE_BASE:-ultralytics/ultralytics:8.4.198-cpu}
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /edge/app        # main.py와 tests에서 `import compliance` 가능
      PYTHONUNBUFFERED: "1"
    working_dir: /edge
    command: python app/main.py
    volumes:
      - ./app:/edge/app:ro
      - ./tests:/edge/tests:ro
      - ./models:/models:ro        # best.pt
      - ./data:/data               # sample.mp4, events.jsonl
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 같은 PC에서 띄운 server에 접속할 때
