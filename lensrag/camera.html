<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>LensRAG Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>html,body{margin:0;padding:0;}body{overscroll-behavior:none;}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface": "#0b1326",
        "surface-container-lowest": "#060e20",
        "surface-container-low": "#131b2e",
        "surface-container": "#171f33",
        "surface-container-high": "#222a3d",
        "surface-variant": "#2d3449",
        "surface-bright": "#31394d",
        "on-surface": "#dae2fd",
        "on-surface-variant": "#c3c6d7",
        "outline": "#8d90a0",
        "primary": "#b4c5ff",
        "primary-container": "#2563eb",
        "on-primary-container": "#eeefff",
        "inverse-primary": "#0053db",
        "secondary": "#7bd0ff",
        "error": "#ffb4ab"
      },
      borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
      spacing: {
        "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "0.75rem",
        "space-lg": "1.25rem", "space-xl": "2rem", "margin": "1rem"
      },
      fontFamily: { sans: ["Inter", "sans-serif"] },
      fontSize: {
        "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "500" }],
        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }],
        "body-sm": ["12px", { lineHeight: "16px" }],
        "body-md": ["14px", { lineHeight: "20px" }],
        "headline-sm": ["16px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "600" }]
      }
    }
  }
};
</script>
</head>
<body class="bg-surface font-sans text-body-md text-on-surface antialiased min-h-screen flex flex-col">

<header class="h-14 px-margin flex items-center justify-between bg-surface-container-lowest">
  <div class="flex items-center gap-space-md">
    <div class="w-7 h-7 rounded-lg bg-primary-container flex items-center justify-center">
      <span class="material-symbols-outlined text-on-primary-container text-[18px]">filter_center_focus</span>
    </div>
    <span class="text-headline-sm tracking-tight">LensRAG Camera</span>
  </div>
  <span class="text-label-sm px-space-sm py-1 rounded-full bg-surface-container-high text-outline flex items-center gap-1.5" id="wsStatus">
    <span class="w-2 h-2 rounded-full bg-outline"></span>연결 중
  </span>
</header>

<main class="flex-1 flex flex-col gap-space-lg p-margin">
  <!-- 카메라 화면: 가이드 박스 비율은 PC 화면과 동일 -->
  <div class="relative w-full rounded-xl overflow-hidden bg-surface-container-lowest border border-surface-variant/30">
    <video id="video" class="block w-full h-auto" autoplay muted playsinline></video>
    <div class="absolute border-2 border-secondary rounded-xl pointer-events-none" style="left:5%;top:30%;width:90%;height:40%;box-shadow:0 0 0 9999px rgba(6,14,32,0.45);"></div>
    <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center gap-space-md p-space-xl text-center">
      <span class="material-symbols-outlined text-[40px] text-outline">photo_camera</span>
      <p id="cameraMessage" class="text-body-sm text-on-surface-variant">카메라를 시작하는 중...</p>
      <button id="startCameraBtn" class="hidden px-space-lg py-space-sm rounded-lg bg-primary-container text-on-primary-container text-label-md">카메라 시작</button>
    </div>
  </div>

  <p class="text-body-sm text-on-surface-variant text-center">영어 문장을 파란 박스 안에 맞춘 뒤 <b>문장 인식</b>을 누르세요.</p>

  <button id="recognizeBtn" disabled class="w-full py-space-md rounded-lg bg-primary-container text-on-primary-container text-headline-sm flex items-center justify-center gap-space-sm disabled:opacity-50 transition-colors">
    <span class="material-symbols-outlined text-[20px]">document_scanner</span><span>문장 인식</span>
  </button>

  <div class="bg-surface-container-low p-space-lg rounded-xl flex flex-col gap-space-sm border border-surface-variant/30 min-h-[120px]">
    <span class="text-label-sm text-secondary font-medium flex items-center gap-1.5">
      <span class="material-symbols-outlined text-[16px]">text_fields</span> 인식된 문장
    </span>
    <div id="ocrResult" class="text-body-md leading-relaxed whitespace-pre-wrap"><span class="text-outline">아직 인식된 문장이 없습니다.</span></div>
  </div>
</main>

<canvas id="frameCanvas" class="hidden"></canvas>
<canvas id="ocrCanvas" class="hidden"></canvas>

<script>
(function () {
  // 가이드 박스 영역 (비율) — 위 오버레이, main.html 오버레이와 같은 값
  const GUIDE = { x: 0.05, y: 0.30, w: 0.90, h: 0.40 };
  const FRAME_WIDTH = 640;
  const FRAME_INTERVAL_MS = 100;

  const video = document.getElementById('video');
  const placeholder = document.getElementById('cameraPlaceholder');
  const cameraMessage = document.getElementById('cameraMessage');
  const startCameraBtn = document.getElementById('startCameraBtn');
  const recognizeBtn = document.getElementById('recognizeBtn');
  const ocrResult = document.getElementById('ocrResult');
  const wsStatus = document.getElementById('wsStatus');
  const frameCanvas = document.getElementById('frameCanvas');
  const ocrCanvas = document.getElementById('ocrCanvas');

  let ws = null;
  let sendingFrame = false;
  let ocrWorker = null;

  // ---------- WebSocket ----------
  function setWsStatus(connected) {
    wsStatus.className = 'text-label-sm px-space-sm py-1 rounded-full bg-surface-container-high flex items-center gap-1.5 '
      + (connected ? 'text-secondary' : 'text-outline');
    wsStatus.innerHTML = connected
      ? '<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>PC 연결됨'
      : '<span class="w-2 h-2 rounded-full bg-outline"></span>연결 중';
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'hello', role: 'camera' }));
      setWsStatus(true);
    };
    ws.onclose = () => {
      setWsStatus(false);
      setTimeout(connect, 1500);
    };
  }

  function sendJson(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  // ---------- 카메라 & 프레임 전송 ----------
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraMessage.textContent = '이 브라우저에서는 카메라를 사용할 수 없습니다. HTTPS 주소로 접속했는지 확인하세요.';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      placeholder.classList.add('hidden');
      recognizeBtn.disabled = false;
      setInterval(sendFrame, FRAME_INTERVAL_MS);
    } catch (err) {
      cameraMessage.textContent = '카메라를 열 수 없습니다: ' + err.message;
      startCameraBtn.classList.remove('hidden');
    }
  }

  function sendFrame() {
    if (sendingFrame || !ws || ws.readyState !== WebSocket.OPEN || ws.bufferedAmount > 0 || !video.videoWidth) return;
    sendingFrame = true;
    const scale = Math.min(1, FRAME_WIDTH / video.videoWidth);
    frameCanvas.width = Math.round(video.videoWidth * scale);
    frameCanvas.height = Math.round(video.videoHeight * scale);
    frameCanvas.getContext('2d').drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
    frameCanvas.toBlob((blob) => {
      if (blob && ws.readyState === WebSocket.OPEN) ws.send(blob);
      sendingFrame = false;
    }, 'image/jpeg', 0.6);
  }

  startCameraBtn.addEventListener('click', () => {
    startCameraBtn.classList.add('hidden');
    cameraMessage.textContent = '카메라를 시작하는 중...';
    startCamera();
  });

  // ---------- 영어 문장 인식 (Tesseract.js) ----------
  async function getOcrWorker() {
    if (!ocrWorker) ocrWorker = await Tesseract.createWorker('eng');
    return ocrWorker;
  }

  function showResult(text, muted) {
    ocrResult.innerHTML = '';
    const span = document.createElement('span');
    if (muted) span.className = 'text-outline';
    span.textContent = text;
    ocrResult.appendChild(span);
  }

  recognizeBtn.addEventListener('click', async () => {
    if (!video.videoWidth) return;
    recognizeBtn.disabled = true;
    showResult('인식 중...', true);
    sendJson({ type: 'ocr', status: 'running' });

    // 가이드 박스 영역만 원본 해상도로 잘라 인식
    const sx = video.videoWidth * GUIDE.x;
    const sy = video.videoHeight * GUIDE.y;
    const sw = video.videoWidth * GUIDE.w;
    const sh = video.videoHeight * GUIDE.h;
    ocrCanvas.width = Math.round(sw);
    ocrCanvas.height = Math.round(sh);
    ocrCanvas.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, ocrCanvas.width, ocrCanvas.height);

    try {
      const worker = await getOcrWorker();
      const { data } = await worker.recognize(ocrCanvas);
      const text = data.text.replace(/\s+/g, ' ').trim();
      if (text) {
        showResult(text, false);
        sendJson({ type: 'ocr', status: 'done', text });
      } else {
        showResult('문장을 찾지 못했습니다. 다시 시도하세요.', true);
        sendJson({ type: 'ocr', status: 'empty' });
      }
    } catch (err) {
      showResult('인식 실패: ' + err.message, true);
      sendJson({ type: 'ocr', status: 'error', text: err.message });
    } finally {
      recognizeBtn.disabled = false;
    }
  });

  connect();
  startCamera();
})();
</script>
</body>
</html>
